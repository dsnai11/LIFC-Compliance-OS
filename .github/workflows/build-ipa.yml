# Builds the LIFC Compliance OS iPhone app (Capacitor project in mobile/) and uploads an UNSIGNED .ipa
# as a workflow artifact. iOS only installs signed apps: re-sign the .ipa with Sideloadly/AltStore (Apple ID)
# or with an Apple Developer account before installing it on a device.
# Run it from the repository's "Actions" tab → "Build iOS IPA" → "Run workflow".
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - "web/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: Build (unsigned, for iPhone)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry LIFC-Compliance-unsigned.ipa Payload)
          cp "$RUNNER_TEMP/ipa/LIFC-Compliance-unsigned.ipa" "$GITHUB_WORKSPACE/LIFC-Compliance-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: LIFC-Compliance-OS-ipa
          path: LIFC-Compliance-unsigned.ipa
          if-no-files-found: error
