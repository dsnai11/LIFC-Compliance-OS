<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIFC Compliance</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font:15px/1.5 system-ui,-apple-system,Roboto,sans-serif;color:#1b1f2a;background:radial-gradient(500px 400px at 0 0,#ffd3db,transparent 70%),#fbf8f9}
.c{width:100%;max-width:420px;background:#fffc;border-radius:24px;padding:26px 22px;box-shadow:0 20px 40px -24px #460c2459}h1{font-size:20px;text-align:center;margin:0 0 6px}p{color:#5f6677;font-size:13px;text-align:center;margin:0 0 18px}
label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5f6677}input{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid #5b0d162b;margin:6px 0 14px}
button{width:100%;font:inherit;font-weight:700;color:#fff;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#d31b3a,#b3122e 45%,#5b0d16)}#e{color:#a30c22;font-size:13px;min-height:20px}
</style></head><body><div class="c"><h1>Connect to Compliance OS</h1><p>Enter the address of your company's Compliance OS server.</p>
<label for="u">Server address</label><input id="u" inputmode="url" autocapitalize="none" autocorrect="off" placeholder="https://compliance.lifc.in"><div id="e"></div><button id="go">Connect</button></div>
<script>
var K='cct_server',i=document.getElementById('u'),e=document.getElementById('e');
function go(v){v=v.trim().replace(/\/+$/,'');if(!v)return;if(v.indexOf('://')<0)v='https://'+v;try{localStorage.setItem(K,v)}catch(x){}
 e.textContent='Connecting…';var t=new AbortController();setTimeout(function(){t.abort()},6000);
 fetch(v+'/api/bootstrap',{mode:'no-cors',signal:t.signal}).then(function(){location.href=v+'/app/'}).catch(function(){e.textContent='Cannot reach '+v+'. Check the address and your network.';});}
document.getElementById('go').onclick=function(){go(i.value)};i.addEventListener('keydown',function(ev){if(ev.key==='Enter')go(i.value)});
var s='';try{s=localStorage.getItem(K)||''}catch(x){}i.value=s;if(s&&location.search.indexOf('change')<0)go(s);
</script></body></html>
