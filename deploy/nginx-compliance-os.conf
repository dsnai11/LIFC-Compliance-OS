# /etc/nginx/sites-available/compliance-os  (then: ln -s ../sites-available/compliance-os /etc/nginx/sites-enabled/)
server {
    listen 80;
    server_name compliance.lifc.in;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name compliance.lifc.in;

    ssl_certificate     /etc/ssl/lifc/compliance.lifc.in.crt;
    ssl_certificate_key /etc/ssl/lifc/compliance.lifc.in.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
