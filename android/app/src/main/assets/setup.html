<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect – LIFC Compliance</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font:15px/1.5 system-ui,Roboto,sans-serif;color:#1b1f2a;
background:radial-gradient(500px 400px at 0% 0%,#ffd3db,transparent 70%),radial-gradient(500px 400px at 100% 100%,#e4e8f0,transparent 70%),#fbf8f9}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border:1px solid #fff;border-radius:24px;padding:28px 24px;box-shadow:0 20px 40px -24px rgba(70,12,24,.35)}
img{width:180px;display:block;margin:0 auto 8px}h1{text-align:center;font-size:20px;margin:4px 0}p{color:#5f6677;font-size:13px;text-align:center;margin:0 0 20px}
label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5f6677}
input{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid rgba(91,13,22,.18);margin:6px 0 16px;background:#fff}
button{width:100%;font:inherit;font-weight:700;color:#fff;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#d31b3a,#b3122e 45%,#5b0d16);box-shadow:0 10px 20px -10px rgba(179,18,46,.8)}
.hint{font-size:12px;color:#5f6677;margin-top:14px}
</style></head><body>
<div class="card"><img src="logo.png" alt="LIFC"><h1>Connect to Compliance OS</h1><p>Enter the address of your company's Compliance OS server.</p>
<label for="u">Server address</label><input id="u" inputmode="url" autocapitalize="none" placeholder="https://compliance.lifc.in">
<button id="go">Connect</button>
<div class="hint">Ask your IT administrator for the address. Use HTTPS for access outside the office network. You can change it later from the app menu (“Change server”).</div></div>
<script>
var i=document.getElementById('u');try{var s=AndroidBridge.getServer();if(s)i.value=s;}catch(e){}
document.getElementById('go').onclick=function(){var v=i.value.trim();if(!v){i.focus();return;}AndroidBridge.setServer(v);};
i.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('go').click();});
</script></body></html>
